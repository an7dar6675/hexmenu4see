<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumia Menu</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        html, body {
            background: transparent !important;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            color: #fff;
        }

        /* App mount point */
        #app {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        /* Top info bar */
        .hud-header {
            position: fixed;
            top: 2vh;
            left: 2vh;
            display: flex;
            align-items: center;
            gap: 1.2vh;
            background: rgba(18, 18, 22, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 0.6vh;
            padding: 0.8vh 1.4vh;
            font-size: 1.15vh;
            color: #d1d5db;
            z-index: 100000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .hud-badge {
            background: var(--ui-main, #e74c3c);
            color: white;
            padding: 0.25vh 0.7vh;
            border-radius: 0.35vh;
            font-weight: 700;
            font-size: 1vh;
            letter-spacing: 0.05vh;
            text-transform: uppercase;
        }

        .hud-keys {
            display: flex;
            align-items: center;
            gap: 0.8vh;
        }

        .hud-key {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 0.2vh 0.6vh;
            border-radius: 0.3vh;
            font-family: monospace;
            font-size: 1vh;
            font-weight: 600;
        }

        /* Quick test panel (bottom left) */
        .test-toolbox {
            position: fixed;
            bottom: 2vh;
            left: 2vh;
            z-index: 100000;
            background: rgba(16, 17, 22, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.8vh;
            padding: 1.2vh;
            width: 28vh;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .test-toolbox.collapsed {
            transform: translateY(calc(100% - 4vh));
        }

        .toolbox-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            padding-bottom: 0.8vh;
            margin-bottom: 0.8vh;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 1.15vh;
            font-weight: 600;
            color: #fff;
        }

        .toolbox-header .toggle-icon {
            font-size: 1.2vh;
            transition: transform 0.25s ease;
        }

        .test-toolbox.collapsed .toggle-icon {
            transform: rotate(180deg);
        }

        .toolbox-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.6vh;
        }

        .tb-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            font-size: 1.05vh;
            font-family: inherit;
            padding: 0.7vh 0.8vh;
            border-radius: 0.4vh;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5vh;
            text-align: center;
        }

        .tb-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-0.1vh);
        }

        .tb-btn.full-width {
            grid-column: span 2;
        }

        .tb-btn.primary {
            background: var(--ui-main, #e74c3c);
            color: #fff;
            border-color: transparent;
            font-weight: 600;
        }

        .tb-btn.primary:hover {
            opacity: 0.9;
            filter: brightness(1.1);
        }

        .color-row {
            grid-column: span 2;
            display: flex;
            gap: 0.4vh;
            margin-top: 0.4vh;
        }

        .color-dot {
            flex: 1;
            height: 1.6vh;
            border-radius: 0.3vh;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .color-dot:hover {
            transform: scale(1.1);
        }

    /* ---- Lumia adapter: wrapped tab strips + readable option rows ---- */
    #menu-tabs, #menu-subtabs { display: block !important; }
    #menu-subtabs:empty { display: none !important; }
    .tab-row { display: flex !important; width: 100%; }
    #menu-tabs .tab-item, #menu-subtabs .tab-item { height: 2.92vh; line-height: 2.92vh; padding: 0; }
    .menu-item > .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .components-container { flex-shrink: 0; }
    </style>
</head>
<body>

    <div id="app"></div>

    @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

    #menu-root {
        font-family: sans-serif;
        color: white;
        position: fixed;
        top: 21.5vh;
        left: 14.25vh;
        width: 35vh;
        z-index: 1000;
        opacity: 0;
        transform: scale(0.95);
        transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #menu-root.visible { opacity: 1; transform: scale(1); }
    #menu-root.hiding { opacity: 0; transform: scale(0.95); }

    #tooltip-container {
        font-family: sans-serif;
        position: fixed;
        top: 21.5vh;
        left: calc(14.25vh + 35vh + 0.5vh);
        width: 20vh;
        background-color: rgb(20, 20, 20);
        border-radius: 0.45vh;
        padding: 0.9vh 1.4vh;
        font-size: 1.3vh;
        display: none;
        opacity: 0;
        transform: scale(0.95);
        transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #tooltip-container.visible { display: block; opacity: 1; transform: scale(1) translateY(0); }
    #tooltip-container.hiding { opacity: 0; transform: scale(0.95) translateY(-0.45vh); }

    .tooltip-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5vh; min-height: 2.2vh; box-sizing: border-box; }
    .tooltip-item:last-child { margin-bottom: 0; }
    .tooltip-label { color: rgba(255,255,255,0.85); flex-shrink: 0; }
    .tooltip-value-container { display: flex; align-items: center; gap: 0.5vh; min-height: 2.2vh; flex-shrink: 0; }
    .tooltip-value { font-weight: 500; color: rgba(255,255,255,0.85); line-height: 1.2; }
    .tooltip-icon { width: auto; height: 1.45vh; object-fit: cover; flex-shrink: 0; order: -1; }
    .tooltip-image { width: 2.2vh; height: 2.2vh; border-radius: 0.3vh; object-fit: cover; flex-shrink: 0; }
    .tooltip-bar { width: 0.45vh; height: 1.45vh; background-color: rgba(255,255,255,0.1); border-radius: 0.45vh; position: relative; overflow: hidden; flex-shrink: 0; }
    .tooltip-bar-fill { position: absolute; bottom: 0; left: 0; width: 100%; border-radius: 0.15vh; transition: height 0.5s cubic-bezier(0.4, 0, 0.2, 1); }

    #header-wrapper {
        background-color: var(--ui-back);
        border-radius: 0.45vh;
        overflow: hidden;
        margin-bottom: 0.45vh;
        opacity: 0;
        transform: translateY(-0.9vh);
        transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #header-wrapper.visible { opacity: 1; transform: translateY(0); }
    #header-wrapper.hiding { opacity: 0; transform: translateY(-0.9vh); }

    #menu-container {
        background-color: rgba(var(--ui-back-r), var(--ui-back-g), var(--ui-back-b), 0.8);
        border-radius: 0.45vh;
        overflow: hidden;
        position: relative;
        opacity: 0;
        transform: translateY(-0.45vh);
        transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #menu-container.visible { opacity: 1; transform: translateY(0); }
    #menu-container.hiding { opacity: 0; transform: translateY(-0.45vh); }

    #menu-banner { padding: 0; overflow: hidden; }
    #banner-image { width: 100%; height: 10vh; object-fit: cover; display: block; }

    #menu-tabs { display: flex; }
    .tab-item {
        flex: 1; min-width: 0; padding: 0.8vh 0; font-size: 1.1vh; text-align: center;
        cursor: pointer; color: rgba(255,255,255,0.6); background: transparent;
        border-bottom-left-radius: 0.5vh; border-bottom-right-radius: 0.5vh;
        transition: 0.3s; position: relative; overflow: hidden;
    }
    .tab-item::before {
        content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(to top, rgba(var(--ui-main-r), var(--ui-main-g), var(--ui-main-b), 0.3) 0%, transparent 85%);
        transform: scaleY(0); transform-origin: bottom; transition: 0.5s; z-index: -1;
    }
    .tab-item.single { min-width: 8vh; flex-grow: 0; padding: 0.8vh 1vh; flex-basis: auto; }
    .tab-item.active { color: white; font-weight: 500; }
    .tab-item.active::before { transform: scaleY(1); }

    #menu-items { position: relative; max-height: 39vh; overflow: hidden; }
    #items-list { position: relative; transition: transform 0.25s ease-out; }

    .menu-item {
        display: flex; justify-content: space-between; align-items: center;
        padding: 1vh 1vh; font-size: 1.2vh; border-radius: 0.2vh;
        transition: background-color 0.2s ease-in-out; height: 3vh; box-sizing: border-box;
    }
    .separator-container { display: flex; align-items: center; width: 100%; gap: 1vh; }
    .separator-bar { flex: 1; height: 0.3vh; background-color: rgba(255,255,255,0.8); min-width: 2vh; border-radius: 0.2vh; }
    .separator-text { color: rgba(255,255,255,0.9); font-weight: 500; white-space: nowrap; padding: 0 0.5vh; }
    .menu-item.separator { justify-content: center; font-weight: 500; color: rgba(255,255,255,0.6); padding: 0.8vh 1.5vh; pointer-events: none; }

    #selection-highlight {
        position: absolute; margin-top: 0.2vh; left: 0.2vh; right: 0.2vh; height: 2.4vh;
        background-color: rgba(var(--ui-main-r), var(--ui-main-g), var(--ui-main-b), 0.35);
        border: 0.1vh solid rgba(var(--ui-main-r), var(--ui-main-g), var(--ui-main-b), 0.35);
        box-shadow: 0 0 0.2vh 0.2vh rgba(var(--ui-main-r), var(--ui-main-g), var(--ui-main-b), 0.35);
        border-radius: 0.4vh; z-index: -1; transition: top 0.25s ease-out;
    }

    .components-container { display: flex; gap: 1vh; align-items: center; }
    .component { display: flex; align-items: center; gap: 0.5vh; }
    .component.icon { order: -1; }
    .component .icon-image { width: auto; height: 1.6vh; object-fit: contain; flex-shrink: 0; }
    .component .slider-component { display: flex; align-items: center; justify-content: center; width: auto; font-size: 1.2vh; text-align: center; user-select: none; }
    .component .slider-component span { margin: 0 0.8vh; min-width: 5vh; }
    .component .slider-component span::before { content: '- '; color: rgba(255,255,255,0.6); }
    .component .slider-component span::after { content: ' -'; color: rgba(255,255,255,0.6); }
    .component .range-component { position: relative; width: 8vh; height: 2vh; display: flex; align-items: center; }
    .component .range-value { position: absolute; top: -1.6vh; left: 50%; transform: translateX(-50%) scale(0); background: #333; color: #fff; padding: 0.2vh 0.6vh; border-radius: 0.3vh; font-size: 1.1vh; transition: transform 0.15s ease-out, opacity 0.15s ease-out; opacity: 0; pointer-events: none; }
    .component .range-component:hover .range-value { transform: translateX(-50%) scale(1); opacity: 1; }
    .component .range-track { position: absolute; left: 0; width: 100%; height: 0.4vh; background-color: rgba(255,255,255,0.2); border-radius: 0.2vh; z-index: 1; }
    .component .range-fill { position: absolute; left: 0; height: 0.4vh; background-color: #fff; border-radius: 0.2vh; z-index: 2; }
    .component input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 0.4vh; background: transparent; outline: none; padding: 0; margin: 0; cursor: pointer; position: relative; z-index: 3; }
    .component input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 1.4vh; height: 1.4vh; background: #fff; border-radius: 50%; cursor: pointer; margin-top: 0; }
    .component input[type="range"]::-moz-range-thumb { width: 1.4vh; height: 1.4vh; background: #fff; border-radius: 50%; cursor: pointer; border: none; }
    .component button { background: #4a4a4a; border: none; color: white; padding: 0.3vh 0.8vh; border-radius: 0.3vh; font-size: 1.2vh; cursor: pointer; transition: background 0.2s ease; }
    .component button:hover { background: #6a6a6a; }
    .component input[type="checkbox"] { -webkit-appearance: none; appearance: none; background-color: #333; margin: 0; width: 3.3vh; height: 1.4vh; border-radius: 1vh; cursor: pointer; position: relative; transition: background-color 0.2s ease-in-out; }
    .component input[type="checkbox"]::after { content: ''; position: absolute; top: 0.2vh; left: 0.2vh; width: 1vh; height: 1vh; background-color: #f0f0f0; border-radius: 50%; transition: left 0.2s ease-in-out; }
    .component input[type="checkbox"]:checked { background-color: rgba(var(--ui-main-r), var(--ui-main-g), var(--ui-main-b), 0.75); }
    .component input[type="checkbox"]:checked::after { left: 2vh; }

    #menu-footer {
        background-color: var(--ui-back);
        display: flex; justify-content: space-between; align-items: center;
        border-radius: 0.45vh; padding: 0.45vh 0.95vh; font-size: 1.15vh; color: white;
        margin-top: 0.45vh; height: 1.95vh;
        opacity: 0; transform: translateY(1vh);
        transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #menu-footer.visible { opacity: 1; transform: translateY(0); }
    #menu-footer.hiding { opacity: 0; transform: translateY(1vh); }
    #footer-left { font-weight: 500; }
    #footer-right { font-family: monospace; }

    #menu-scrollbar {
        position: absolute; left: -1.2vh; top: 13.25vh; width: 0.6vh; height: 39vh;
        opacity: 0; transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #menu-scrollbar.visible { opacity: 1; }
    #menu-scrollbar.hiding { opacity: 0; }
    #scrollbar-track { width: 100%; height: 100%; background-color: rgba(var(--ui-back-r), var(--ui-back-g), var(--ui-back-b), 0.8); border-radius: 0.4vh; position: relative; }
    #scrollbar-thumb { position: absolute; top: 0; left: 0; width: 100%; background-color: rgba(var(--ui-main-r), var(--ui-main-g), var(--ui-main-b), 0.7); border-radius: 0.2vh; transition: top 0.25s ease-out, height 0.25s ease-out; min-height: 2vh; }
    #scrollbar-thumb:hover { background-color: rgba(var(--ui-main-r), var(--ui-main-g), var(--ui-main-b), 0.9); }

    #notification-container {
        position: fixed; font-family: sans-serif; bottom: 2vh; right: 2vh; z-index: 2000;
        display: flex; flex-direction: column; align-items: flex-end; gap: 1vh;
        pointer-events: none; width: 30vh;
    }

    .input-overlay {
        position: fixed; top: 0; left: 0; transform: none; width: 100%; height: 100%;
        background: rgb(0,0,0,0.5); z-index: 999999; color: white; font-weight: 300;
        font-family: sans-serif; font-size: 1.2vh; transition: 0.5s;
    }
    .input-box {
        background-color: rgba(var(--ui-back-r), var(--ui-back-g), var(--ui-back-b), 0.8);
        border-radius: 0.25vh; display: flex; flex-direction: column;
        position: fixed; bottom: 17.5vh; left: 50%; transform: translateX(-50%);
        height: auto; width: 55vh; overflow: hidden;
    }
    .input-box > .input-header { padding: 0.8vh 1vh 0.8vh 1vh; border-bottom: 0.1vh solid var(--ui-main); width: 100%; font-size: 1.2vh; }
    .input-box input { padding: 1.25vh 1vh 1.25vh 1vh; border: none; outline: none; background: transparent; color: white; font-size: 1.2vh; }
    .input-box input::selection { background-color: var(--ui-main); color: white; }
    .input-header-inner { display: flex; align-items: center; gap: 0.5vh; }
    .input-header-inner img { width: auto; height: 2vh; object-fit: contain; }
    .input-divider { width: 0.2vh; height: 1.5vh; background: white; }
    .input-header-text { color: white; }

    .notification {
        width: 100%; min-height: 5.5vh;
        background-color: rgba(var(--ui-back-r), var(--ui-back-g), var(--ui-back-b), 0.8);
        padding: 1.1vh 5vh 1.1vh 1.5vh; display: flex; flex-direction: column;
        gap: 0.35vh; word-wrap: break-word; word-break: break-word; hyphens: auto;
        box-sizing: border-box; transform: translateX(100%); opacity: 0;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative; overflow: hidden;
    }
    .notification.show { transform: translateX(0); opacity: 1; }
    .notification.hide { transform: translateX(100%); opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.6, 1); }
    .notification-side { position: absolute; top: -1.1vh; left: 0; height: calc(100% + 2.2vh); width: 0.3vh; }
    .notification-header { font-weight: 600; font-size: 1.4vh; color: white; margin-bottom: 0.15vh; line-height: 1.3; word-wrap: break-word; word-break: break-word; }
    .notification-message { font-size: 1.1vh; color: rgba(255,255,255,0.85); line-height: 1.4; word-wrap: break-word; word-break: break-word; hyphens: auto; }
    .notification-progress { position: absolute; bottom: 0; left: 0; width: 100%; height: 0.3vh; }
    .notification-progress-bar { position: absolute; top: 0; left: 0; height: 100%; width: 100%; transform-origin: left; transition: transform linear; }
    .notification-icon { position: absolute; right: 1.1vh; top: 50%; transform: translateY(-50%); width: 2.2vh; height: 2.2vh; object-fit: contain; z-index: 1; }

    .live-list-container {
        position: fixed; font-family: sans-serif; color: white; border-radius: 0.35vh;
        padding: 0; font-size: 1.3vh; z-index: 1500; opacity: 0; transform: scale(0.95);
        transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        overflow: hidden;
    }
    .live-list-container.visible { opacity: 1; transform: scale(1); }
    .live-list-container.hiding { opacity: 0; transform: scale(0.95); }
    .live-list-header {
        background-color: rgba(var(--ui-back-r), var(--ui-back-g), var(--ui-back-b), 0.8);
        border-bottom: 0.1vh solid var(--ui-main); padding: 0.4vh 0.5vh; font-weight: 500;
        font-size: 1.1vh; display: flex; align-items: center; gap: 0.6vh;
    }
    .live-list-header-icon { margin-left: 0.25vh; font-size: 1.1vh; line-height: 1; flex-shrink: 0; display: inline-flex; align-items: center; color: var(--ui-main); }
    .live-list-header-text { flex: 1; }
    .live-list-items { background-color: rgba(var(--ui-back-r), var(--ui-back-g), var(--ui-back-b), 0.8); padding: 0.25vh 0.5vh; }
    .live-list-item { display: flex; justify-content: space-between; align-items: center; gap: 1.2vh; margin: 0.35vh 0; font-size: 1vh; box-sizing: border-box; }
    .live-list-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .live-list-value { font-weight: 500; font-size: 0.9vh; text-align: right; white-space: nowrap; flex-shrink: 0; }
    .live-list-value .ll-on { color: #2cc45a; margin-left: 0.5vh; }
    .live-list-value .ll-off { color: #ff4d4d; margin-left: 0.5vh; }

    #help-message-container {
        position: fixed; bottom: 4vh; left: 50%; transform: translateX(-50%) translateY(1vh);
        z-index: 1500; font-family: sans-serif; opacity: 0;
        transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        pointer-events: none;
    }
    #help-message-container.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
    #help-message-container.hiding { opacity: 0; transform: translateX(-50%) translateY(1vh); }
    #help-message {
        color: rgb(255,255,255,0.8); padding: 0.8vh 1.6vh; border-radius: 0.5vh;
        font-size: 1.1vh; font-weight: 400; text-align: center; white-space: nowrap;
        background-color: rgba(var(--ui-back-r), var(--ui-back-g), var(--ui-back-b), 0.8);
        transition: 0.5s;
    }

    #progress-container {
        position: fixed; opacity: 0; top: 0; left: 0; width: 100%; height: 100%;
        background: rgb(0,0,0,0.5); z-index: 999999; color: white; font-weight: 300;
        font-family: sans-serif; font-size: 1.2vh; transition: 0.5s;
    }
    #progress-box { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 35vh; display: flex; flex-direction: column; align-items: center; gap: 1vh; }
    #progress-top-text { color: white; font-size: 1.4vh; text-align: center; text-shadow: 0 0 1vh rgb(255,255,255,0.25),0 0 2vh rgb(255,255,255,0.4),0 0 3vh rgb(255,255,255,0.65),0 0 4vh black,0 0 5vh black; }
    #progress-bar-container { margin: 0.5vh 0; width: 100%; height: 0.65vh; background-color: rgba(var(--ui-back-r), var(--ui-back-g), var(--ui-back-b), 0.8); border-radius: 0.35vh; }
    #progress-bar { margin-top: -0.1vh; width: 0%; height: 100%; background-color: var(--ui-main); border: 0.1vh solid rgba(var(--ui-main-r), var(--ui-main-g), var(--ui-main-b), 0.35); box-shadow: 0 0 0.35vh 0.35vh rgba(var(--ui-main-r), var(--ui-main-g), var(--ui-main-b), 0.35); transition: width 0.3s ease; border-radius: 0.35vh; }
    #progress-percent-text { color: white; font-size: 1.1vh; font-weight: bold; text-align: center; text-shadow: 0 0 1vh rgb(255,255,255,0.25),0 0 2vh rgb(255,255,255,0.4),0 0 3vh rgb(255,255,255,0.65),0 0 4vh black; }
    #progress-bottom-text { color: white; font-size: 1.3vh; text-align: center; text-shadow: 0 0 1vh rgb(255,255,255,0.25),0 0 2vh rgb(255,255,255,0.4),0 0 3vh rgb(255,255,255,0.65),0 0 4vh black; }

    .hovering-text-wrap {
        position: fixed; bottom: 7.5vh; left: 50%; transform: translateX(-50%);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        outline: none; min-width: 18.52vh;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial;
    }
    .hovering-text-list {
        list-style: none; margin: 0; padding: 0; text-align: center;
        pointer-events: none; user-select: none;
        max-height: calc(9 * (1.3vh * 1.3 + 0.37vh)); overflow-y: auto; overflow-x: hidden;
        scrollbar-width: none; -ms-overflow-style: none;
        display: flex; flex-direction: column; align-items: center; scroll-behavior: smooth;
    }
    .hovering-text-list::-webkit-scrollbar { display: none; }
    .hovering-text-item { padding: 0.185vh 0; font-size: 1.3vh; line-height: 1.3; transition: transform 0.22s cubic-bezier(.2,.9,.2,1), color 0.22s cubic-bezier(.2,.9,.2,1), letter-spacing 0.22s; transform-origin: center; white-space: nowrap; min-width: 27.78vh; font-weight: 600; color: #fff; }
    .hovering-text-inactive { color: #fff; transform: scale(0.98); letter-spacing: 0; }
    .hovering-text-selected { transform: scale(1.03); font-weight: 600; letter-spacing: 0.015vh; color: var(--ui-main); }
    @keyframes hovering-text-pulse { 0% { transform: translateY(-0.185vh) scale(1.03); } 30% { transform: translateY(-0.556vh) scale(1.08); } 100% { transform: translateY(-0.185vh) scale(1.03); } }
    .hovering-text-activated { animation: hovering-text-pulse 0.42s cubic-bezier(.2,.9,.3,1) both; }
    .hovering-text-toast { position: absolute; left: 50%; transform: translateX(-50%); bottom: 8vh; background: transparent; padding: 0.556vh 1.111vh; border-radius: 0.741vh; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 0.26s ease; color: var(--ui-main); }
    .hovering-text-toast.visible { opacity: 1; }
    [data-hovering-text-hidden="true"] { display: none !important; }

                    return;
                case 'input':
                    mirrorInput(d);
                    return;
                case 'keyselect':
                    if (d.active) showKey(d);
                    else hideKey(d);
                    return;
                default:
                    return;
            }
        }

        window.addEventListener('message', function (e) { receive(e.data); });
        window.lumiaPush = receive;
        window.lumiaMessage = receive;

        /* ---------------------------------------------------- browser demo */
        function keyName(e) {
            var map = {
                ' ': 'Space',
                'ArrowUp': 'Up Arrow',
                'ArrowDown': 'Down Arrow',
                'ArrowLeft': 'Left Arrow',
                'ArrowRight': 'Right Arrow',
                'Escape': 'Esc',
                'Control': 'Ctrl'
            };
            if (map[e.key]) return map[e.key];
            if (e.key && e.key.length === 1) return e.key.toUpperCase();
            return e.key || 'Key';
        }

        function openDemo(tab, sub) {
            var list = (DEMO.index && DEMO.index[String(tab)]) || [1];
            if (!sub || list.indexOf(sub) === -1) sub = list[0];
            var st = DEMO.states[String(tab) + ':' + String(sub)];
            if (!st) {
                var keys = Object.keys(DEMO.states);
                for (var i = 0; i < keys.length; i++) {
                    if (keys[i].indexOf(String(tab) + ':') === 0) { st = DEMO.states[keys[i]]; break; }
                }
            }
            if (!st) return;
            demoTab = tab;
            demoSub = sub;
            demoMode = true;
            keyMode = false;
            if (inputEl) inputEl.readOnly = false;
            window.hideInput();
            var ovd = doc.querySelector('.input-overlay');
            if (ovd) {
                ovd.style.transition = 'none';
                ovd.style.opacity = '0';
                ovd.style.pointerEvents = 'none';
            }
            active = st;
            render();
        }

        function startDemo() {
            if (GAME) return;
            demoMode = true;
            showKey({
                started: 1,
                key: 'F9',
                title: 'Menu Open Key',
                text: 'Press any key...',
                message: 'Press any key to set the key that opens the menu. Enter or Esc keeps F9.',
                hint: 'Press any key. Enter or Esc keeps F9.'
            });
            setTimeout(function () {
                if (demoMode && keyMode) {
                    hideKey({ key: 'F9' });
                    openDemo(1, 1);
                }
            }, 7000);
        }

        function demoNavigate(e) {
            if (!active || !active.options || !active.options.length) return;
            var opts = active.options;
            var sel = Math.max(0, num(active.sel, 1) - 1);

            function move(dir) {
                for (var n = 0; n < opts.length; n++) {
                    sel = (sel + dir + opts.length) % opts.length;
                    if (opts[sel] && !opts[sel].separator) break;
                }
                active.sel = sel + 1;
                window.updateSelection(sel);
                syncSelection(sel);
            }

            function valueText(o) {
                if (o.slider) {
                    var it = o.slider.options[num(o.slider.value, 1) - 1];
                    return it ? it.label : String(o.slider.value);
                }
                if (o.range) return String(o.range.value);
                return '';
            }

            function section(dir) {
                var n = DEMO.order.length;
                var idx = ((demoTab - 1 + dir + n) % n) + 1;
                openDemo(idx, 1);
            }

            switch (e.key) {
                case 'ArrowUp':
                    e.preventDefault();
                    move(-1);
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    move(1);
                    break;
                case 'q':
                case 'Q':
                    e.preventDefault();
                    section(-1);
                    break;
                case 'e':
                case 'E':
                    e.preventDefault();
                    section(1);
                    break;
                case 'ArrowLeft': {
                    e.preventDefault();
                    var lo = opts[sel];
                    if (lo && lo.slider) {
                        var ln = lo.slider.options.length;
                        var lv = num(lo.slider.value, 1) - 1;
                        if (lv < 1) lv = ln;
                        lo.slider.value = lv;
                        window.updateSlider(sel, lv);
                        pushNotification('info', lo.name, valueText(lo), 3000);
                    } else if (lo && lo.range) {
                        var ls = num(lo.range.step, 1);
                        var lr = Math.max(num(lo.range.min, 0), num(lo.range.value, 0) - ls);
                        lo.range.value = lr;
                        window.updateRange(sel, lr);
                        pushNotification('info', lo.name, valueText(lo), 3000);
                    }
                    break;
                }
                case 'ArrowRight': {
                    e.preventDefault();
                    var ro = opts[sel];
                    if (ro && ro.slider) {
                        var rn = ro.slider.options.length;
                        var rv = num(ro.slider.value, 1) + 1;
                        if (rv > rn) rv = 1;
                        ro.slider.value = rv;
                        window.updateSlider(sel, rv);
                        pushNotification('info', ro.name, valueText(ro), 3000);
                    } else if (ro && ro.range) {
                        var rs = num(ro.range.step, 1);
                        var rr = Math.min(num(ro.range.max, 100), num(ro.range.value, 0) + rs);
                        ro.range.value = rr;
                        window.updateRange(sel, rr);
                        pushNotification('info', ro.name, valueText(ro), 3000);
                    }
                    break;
                }
                case 'Enter':
                case ' ': {
                    e.preventDefault();
                    var co = opts[sel];
                    if (co && co.checkbox) {
                        co.checkbox.checked = !co.checkbox.checked;
                        window.updateCheckbox(sel, co.checkbox.checked);
                        pushNotification(co.checkbox.checked ? 'success' : 'warn', co.name,
                            co.checkbox.checked ? 'Enabled' : 'Disabled', 3000);
                    } else if (co && co.button) {
                        pushNotification('success', co.name, 'Used', 3000);
                    }
                    break;
                }
                case 'Delete':
                case 'm':
                case 'M':
                    e.preventDefault();
                    setShown(!shown);
                    break;
                case 'Backspace':
                    e.preventDefault();
                    break;
            }
        }

        doc.addEventListener('keydown', function (e) {
            if (!demoMode) return;
            if (keyMode) {
                if (e.key === 'Tab' || e.key === 'F5' || e.key === 'F12') return;
                e.preventDefault();
                var name = (e.key === 'Escape' || e.key === 'Enter') ? 'F9' : keyName(e);
                if (inputEl) {
                    inputEl.readOnly = false;
                    inputEl.value = name;
                    inputEl.readOnly = true;
                }
                hideKey({ key: name });
                setTimeout(function () { openDemo(1, 1); }, 450);
                return;
            }
            demoNavigate(e);
        });

        doc.addEventListener('click', function (e) {
            if (!demoMode || keyMode || !e.target.closest) return;
            var tab = e.target.closest('.tab-item');
            if (tab) {
                var idx = parseInt(tab.getAttribute('data-index'), 10) + 1;
                if (tab.getAttribute('data-kind') === 'sub') openDemo(demoTab, idx);
                else openDemo(idx, 1);
                return;
            }
            var row = e.target.closest('.menu-item');
            if (row && !row.classList.contains('separator')) {
                var i = parseInt(row.getAttribute('data-index'), 10);
                if (!isNaN(i)) {
                    if (active) active.sel = i + 1;
                    window.updateSelection(i);
                    syncSelection(i);
                }
            }
        });

        if (doc.readyState === 'loading') {
            doc.addEventListener('DOMContentLoaded', function () { setTimeout(startDemo, 250); });
        } else {
            setTimeout(startDemo, 250);
        }
    })();
    </script>

</body>
</html>
